spring.application.name=YouTube_Statistics_Part03
server.port=8090

spring.datasource.url=jdbc:mysql://localhost:3306/database
# springboottutorial
spring.datasource.username=${YOUTUBE_MYSQL_USER}
# password
spring.datasource.password=${YOUTUBE_MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database=mysql

youtube.api.key=${YOUTUBE_API_KEY}
youtube.api.video.url=${YOUTUBE_API_VIDEO_URL}
