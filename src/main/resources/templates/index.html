<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Spring Boot Tutorials</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@latest/dist/htmx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-json@latest/dist/htmx-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; color: black; margin: 30px; text-align: center;}
        label { display:inline-block; width: 150px; text-align:right;}
        input { width: 250px; }
        button { width: 150px; }
        form {margin: 10px;}
        #video-info, p, h3 {text-align: left;}
        #toggle_mode_button {
            position: absolute;
            right: 100px;
            height: 30px;
        }
        p{
            line-height: 1.0;
            margin: 3px;
        }
        div {
            display:inline-block;
            width: 700px;
            border: 5px solid black;
            border-radius: 10px;
            padding: 10px;
            font-size: 12px;
        }
        .chart {
            border: 5px solid black;
            border-radius: 10px;
            display:inline-block;
            width: 1000px;
            height: 500px;
        }
        .chart_small {
            display:inline-block;
            width: 600px;
            height: 300px;
        }
        .dark-mode_border {
            border: 5px solid white;
        }
        .dark-mode {
            background-color: black;
            color: white;
        }
        .center {
            text-align: center;
        }
    </style>
</head>
<body>
<input type="hidden" id="hidden_input" value="views">
<input type="hidden" id="hidden_video_input" value="Wb8Tq_HD4E8">
<button id="toggle_mode_button">Toggle dark mode</button>
<h1>Spring Boot Tutorial</h1>
<form hx-get="http://localhost:8090/api/video-info"
      hx-target="#video-info"
      hx-swap="json">
    <label for="video_Id">Video info: </label>
    <input  id="video_Id"
            type="text"
            name="video_Id"
            value="Video Id..."/>
    <button type="submit">Get Video info</button>
</form>

<template hx-target="#video-info"
          hx-get="http://localhost:8090/api/video-info"
          hx-vals='js:{videoId: document.getElementById("hidden_video_input").value}'
          hx-trigger="load, click, every 5m"
          hx-swap="innerHTML"></template>

<template id="load_chart"
          hx-get="/chart-data"
          hx-target="#chart-data"
          hx-trigger="load, click, every 60s"
          hx-swap="innerHTML"
          hx-vals='js:{chartOptions: document.getElementById("hidden_input").value}'></template>

<template id="chart-data"></template>
<div id="chart" class="chart">
    <canvas id="videoChart"></canvas>
</div>
<p class="center">
    <button id="toggle_chart_button">Total</button>
    <button id="toggle_width_button">Small</button>
</p>
<h3>Video Info: </h3>
<div id="video-info">

</div>
<script>
    document.querySelector("#toggle_chart_button").addEventListener("click", () => {
        const val = document.getElementById('hidden_input').value;
        document.getElementById('hidden_input').value = val === "total" ? "views" : "total";
        htmx.trigger("#load_chart", "click");
        document.getElementById('toggle_chart_button').textContent =
            val === "total" ? "Total" : "Views";
    });
    const myData = document.getElementById("chart-data");
    const chart = new Chart(document.querySelector("#videoChart"), {
        type: "bar",
        data: {
            labels: [],
            datasets: [{
                label: "Video Statistics from: " + document.getElementById('hidden_video_input').value,
                data: [],
                backgroundColor: '#0000ff'
            }]
        }
    });
    myData.addEventListener("htmx:afterSwap", (event) => {
        if (event.detail.target.id !== "chart-data") return;
        chart.data.labels = labels;
        chart.data.datasets[0].data = values;
        chart.update();
    });
    document.querySelector("#toggle_mode_button").addEventListener("click", () => {
        const element_body = document.body;
        element_body.classList.toggle("dark-mode");
        const element_div = document.querySelectorAll("div");
        element_div.forEach(element => {element.classList.toggle("dark-mode_border");});
    });
    document.querySelector("#toggle_width_button").addEventListener("click", () => {
        const element_body = document.getElementById('chart');
        element_body.classList.toggle("chart_small");
        document.getElementById('toggle_width_button').textContent =
            document.getElementById('toggle_width_button').textContent === "Large" ? "Small" : "Large";
    });
</script>
</body>
</html>
